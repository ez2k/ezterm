name: release

# Fork-friendly automated build + release workflow for ez2k/ezterm.
#
# - Push to `main`: builds all platforms and creates a new patch release
#   (auto-bumped from the latest v* release; `.release-version` is the
#   floor - bump it to jump minor/major) titled with the build date and
#   run number. Falls back to updating the rolling `nightly` pre-release
#   if no version can be determined.
# - Push a tag matching `v*` or `20*`, or dispatch with a `version` input:
#   builds all platforms and creates a release for exactly that version
#   (creating the tag when needed).
#
# The upstream wezterm gen_* workflows gate their upload jobs on
# `github.repository == 'wezterm/wezterm'` and depend on secrets
# (gemfury, homebrew tap, winget, macOS signing) that do not exist in
# this fork, so this standalone workflow handles releases instead.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "20*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. v0.1.0). When set, the run creates the
          tag and a versioned release instead of updating the nightly.
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || '' }}
  cancel-in-progress: true

jobs:
  # Decides whether this run is a versioned release or a nightly update.
  # A versioned run is a tag push, a dispatch with a version input, or a
  # push where the `.release-version` file names a version that has no
  # release yet.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
      - name: "Decide release version"
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          ver=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            ver="$INPUT_VERSION"
          else
            # Auto-bump the patch version on each push to main.
            # .release-version acts as the floor (bump it to jump minor/major).
            base=""
            if [[ -f .release-version ]]; then
              base=$(tr -d '[:space:]' < .release-version)
            fi
            latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [[ -z "$latest" ]]; then
              ver="$base"
            else
              IFS=. read -r maj min pat <<<"${latest#v}"
              ver="v$maj.$min.$((pat + 1))"
              if [[ -n "$base" ]]; then
                ver=$(printf '%s\n%s\n' "$ver" "$base" | sort -V | tail -1)
              fi
            fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release version: '$ver' (empty means nightly)"

  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs: meta
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # deploy.sh names assets "*-nightly*" when BUILD_REASON=Schedule,
      # giving stable filenames that `gh release upload --clobber` replaces.
      BUILD_REASON: ${{ needs.meta.outputs.version == '' && 'Schedule' || ' ' }}
      TAG_NAME: ${{ needs.meta.outputs.version }}
    steps:
      - name: "set APT to non-interactive"
        shell: bash
        run: "echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections"
      - name: "Install base deps"
        shell: bash
        run: "apt update && apt-get install -y git curl openssh-server"
      - name: "Ensure /run/sshd exists"
        shell: bash
        run: "mkdir -p /run/sshd"
      - name: "Workaround git permissions issue"
        shell: bash
        run: "git config --global --add safe.directory '*'"
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build (Release mode)"
        shell: bash
        run: |
          cargo build -p wezterm --release
          cargo build -p wezterm-gui --release
          cargo build -p wezterm-mux-server --release
          cargo build -p strip-ansi-escapes --release
      - name: "Package"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "linux"
          path: |
            wezterm-*.deb
            wezterm-*.xz
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    needs: meta
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      MACOSX_DEPLOYMENT_TARGET: "10.12"
      BUILD_REASON: ${{ needs.meta.outputs.version == '' && 'Schedule' || ' ' }}
      TAG_NAME: ${{ needs.meta.outputs.version }}
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Install Rust targets"
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build (Release mode, universal)"
        shell: bash
        run: |
          for pkg in wezterm wezterm-gui wezterm-mux-server strip-ansi-escapes ; do
            cargo build --target x86_64-apple-darwin -p $pkg --release
            cargo build --target aarch64-apple-darwin -p $pkg --release
          done
      - name: "Package (unsigned)"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "macos"
          path: "WezTerm-*.zip"
          retention-days: 5

  build-windows:
    runs-on: windows-2025
    needs: meta
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
      BUILD_REASON: ${{ needs.meta.outputs.version == '' && 'Schedule' || ' ' }}
      TAG_NAME: ${{ needs.meta.outputs.version }}
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Build (Release mode)"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build -p wezterm --release && cargo build -p wezterm-gui --release && cargo build -p wezterm-mux-server --release && cargo build -p strip-ansi-escapes --release
      - name: "Package"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "windows"
          path: |
            WezTerm-*.zip
            WezTerm-*.exe
          retention-days: 5

  publish:
    runs-on: ubuntu-latest
    needs:
      - meta
      - build-linux
      - build-macos
      - build-windows
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
      - name: "Download artifacts"
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: "Checksum"
        shell: bash
        run: |
          shopt -s nullglob
          for f in wezterm-*.deb wezterm-*.xz WezTerm-*.zip WezTerm-*.exe ; do
            sha256sum "$f" > "$f.sha256"
          done
      - name: "Publish nightly release"
        if: "env.RELEASE_VERSION == ''"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          gh release view nightly || \
            gh release create nightly --prerelease --title "Nightly" \
              --notes "Rolling nightly build, automatically updated from the latest commit on main."
          bash ci/retry.sh gh release upload --clobber nightly \
            wezterm-*.deb wezterm-*.xz WezTerm-*.zip WezTerm-*.exe *.sha256
      - name: "Publish versioned release"
        if: "env.RELEASE_VERSION != ''"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          tag="$RELEASE_VERSION"
          title="$tag ($(date -u +%Y-%m-%d) build #${{ github.run_number }})"
          # --target creates the tag at this commit when it doesn't exist
          # yet (the non-tag-push case)
          gh release view "$tag" || \
            gh release create "$tag" --title "$title" --generate-notes \
              --target "${{ github.sha }}"
          bash ci/retry.sh gh release upload --clobber "$tag" \
            wezterm-*.deb wezterm-*.xz WezTerm-*.zip WezTerm-*.exe *.sha256
